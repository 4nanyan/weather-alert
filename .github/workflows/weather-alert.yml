name: weather-alert

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min: answers commands and sends the daily message on time (GitHub often runs a few minutes late)
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: weather-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0, pinned to a commit so the tag can't change under us
        with:
          ref: main   # always start from the newest saved state, not the one from when the run was queued

      - name: Check weather
        run: python3 weather_alert.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          STATE_KEY: ${{ secrets.STATE_KEY }}   # encrypts your location (state.enc)

      - name: Save state
        run: |
          git config user.name "weather-alert-bot"
          git config user.email "weather-alert-bot@users.noreply.github.com"
          git add -- state.enc   # only the encrypted state, never stray files
          git rm -q --cached --ignore-unmatch -- state.json   # drop old unencrypted state if it was ever committed
          git diff --cached --quiet || (git commit -m "update state" && git push)
